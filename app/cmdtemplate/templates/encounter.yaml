## New encounter difficulty: uncomment the fields you fill in, then save and close the editor.
## Close the editor without saving to cancel.

## Name, e.g. "encounter_deadly". Must be unique.
# name: ""
## Sides of the die rolled.
# dice: 10
# type: roll
# visible: false
## Stat change by roll range, covering 1 to dice.
# intervals:
#   - min: 1
#     max: 5
#     critical: false
#     result: 0
#   - min: 6
#     max: 10
#     critical: false
#     result: 1
