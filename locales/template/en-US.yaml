template.added:
  other: "{{.Kind}} \"{{.Name}}\" added to {{.Path}}"
template.imported:
  other: "{{.Count}} {{.Kind}} imported into {{.Path}}"
template.updated:
  other: "{{.Kind}} \"{{.Name}}\" updated in {{.Path}}"
template.deleted:
  other: "{{.Kind}} \"{{.Name}}\" deleted from {{.Path}}"
template.cancelled:
  other: "Cancelled: nothing was saved"
template.error:exists:
  other: "{{.Kind}} \"{{.Name}}\" already exists: use edit, or import --force to replace it"
template.error:force:
  other: "\"{{.Name}}\" exists: add --force to change or delete it"
template.error:draft:
  other: "{{.Error}}\nDraft kept: {{.Path}}\nFix it, then run: {{.Command}}"
