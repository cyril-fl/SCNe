# Elves
race.elf:
  other: "elf"
race.elf.description:
  other: "Elves are known for their grace, agility, and affinity with nature. They have a long lifespan and are often skilled in magic and archery."

# Humans
race.human:
  other: "human"
race.human.description:
  other: "Humans are the most adaptable and versatile of all races. They can thrive in any environment and are known for their resilience and determination."

# Dwarves
race.dwarf:
  other: "dwarf"
race.dwarf.description:
  other: "Dwarves are stout and hardy, known for their craftsmanship and mining skills. They have a strong sense of community and are often skilled warriors."

# Slimes
race.slime:
  other: "slime"
race.slime.description:
  other: "Slimes are amorphous creatures that can take on various shapes and sizes."

# Halflings
race.halfling:
  other: "halfling"
race.halfling.description:
  other: "Halflings are small, cheerful folk who love comfort and good food. Their luck and nimbleness often get them out of the worst situations."

# Orcs
race.orc:
  other: "orc"
race.orc.description:
  other: "Orcs are fierce and proud warriors from the wild steppes. Feared for their strength, they value honor earned in battle above all else."
