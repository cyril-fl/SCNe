name: "solopg"
i18n: 
  default: "fr"
  dir: "locales"
  format: "yaml"
  locales: 
    - code: en
      iso: "en-US"
      name: "English"
      file: "en-US.yaml"
    - code: fr
      iso: "fr-FR"
      name: Français
      file: "fr-FR.yaml"
commands: 
  config: 
    use: "config"
    short: "Display the configuration of SoloPG"
  logs: 
    use: "logs"
    short: "Display application logs"
    long: "Display the application logs generated by SoloPG."
    example: "solopg logs --tail 100 --filter error"
    args:
      - name: "tail"
        shorthand: "t"
        value: ""
        usage: "Show only the last N log entries"
        type: "int"
      - name: "filter"
        shorthand: "f"
        value: ""
        usage: "Show only logs at the specified kind of level (e.g., error, warning, info)"
        type: "string"
  root: 
    short: "SoloPG CLI"
    long: "SoloPG is a CLI to manage a solo RPG session in the terminal."
    example: |
      solopg run
      solopg load data/template/characters/hero.yaml
      solopg load data/template/characters/hero.yaml --verbose
      solopg load data/template/characters/hero.yaml -v
      solopg load data/template/characters/hero.yaml --verbose=true
      solopg load data/template/characters/hero.yaml --verbose=false
  run: 
    use: "run"
    short: "Run a solo RPG session"
  serve: 
    use: "serve"
    short: "Serve a solo RPG session"
    example: "solopg serve --filter error"
    args:
      - name: "filter"
        shorthand: "f"
        value: ""
        usage: "Show only logs at the specified kind of level (e.g., error, warning, info)"
        type: "string"
  try: 
    use: "try"
    short: "Try a solo RPG session"
  version: 
    use: "version"
    short: "Display the version of SoloPG"
documents:
  files:
    dice: "data/systems/rules/dices/dice.yaml"
    objects_category: "data/systems/attributes/category.yaml"
    classes: "data/systems/attributes/class.yaml"
    combat: "data/systems/rules/combat.yaml"
    priorities: "data/systems/attributes/priorities.yaml"
    ranks: "data/systems/attributes/ranks.yaml"
    races: "data/systems/attributes/races.yaml"
    rarity: "data/systems/attributes/rarirty.yaml"
    slots: "data/systems/attributes/slots.yaml"
    stats: "data/systems/attributes/stats.yaml"
    variety: "data/systems/attributes/variety.yaml"
  folders:
    characters: "data/template/characters"
    encounters: "data/systems/rules/oracles/encounter"
    hint: "data/template/hint"
    locations: "data/template/locations"
    oracle: "data/systems/rules/oracles"